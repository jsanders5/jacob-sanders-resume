name: Compile LaTeX Resume

on:
  push:
    paths:
      - '**.tex'

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-extra \
            texlive-fonts-recommended

      - name: Compile changed .tex files
        run: |
          # Get list of .tex files changed in this push
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- '*.tex' 2>/dev/null || \
                    git diff --name-only $(git hash-object -t tree /dev/null) HEAD -- '*.tex')
          echo "Changed .tex files: $CHANGED"

          for TEX in $CHANGED; do
            if [ -f "$TEX" ]; then
              echo "Compiling $TEX ..."
              DIR=$(dirname "$TEX")
              BASE=$(basename "$TEX")
              # Run twice — hyperref requires a second pass
              pdflatex -interaction=nonstopmode -output-directory="$DIR" "$TEX"
              pdflatex -interaction=nonstopmode -output-directory="$DIR" "$TEX"
            fi
          done

      - name: Remove LaTeX auxiliary files
        run: |
          find . -name '*.aux' -o -name '*.log' -o -name '*.out' -o -name '*.toc' | xargs rm -f

      - name: Create pull request with updated PDF(s)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/compiled-pdf-${{ github.sha }}
          commit-message: "docs: recompile PDF(s) from updated .tex source"
          title: "docs: recompile PDF(s) from updated LaTeX source"
          body: |
            Automated PR generated by the **Compile LaTeX Resume** workflow.

            Triggered by commit: ${{ github.sha }}

            Updated PDF(s) compiled from changed `.tex` file(s).
          add-paths: "*.pdf"
          delete-branch: true
